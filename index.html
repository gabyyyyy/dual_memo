<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>듀얼 메모장</title>
  <style>
    :root {
      --bg: #f3f4f6;
      --panel: #ffffff;
      --panel-2: #f8fafc;
      --text: #111827;
      --sub: #6b7280;
      --border: #d1d5db;
      --accent: #2563eb;
      --highlight: #fff59d;
      --shadow: 0 10px 24px rgba(0, 0, 0, 0.08);
    }

    body.dark {
      --bg: #111827;
      --panel: #1f2937;
      --panel-2: #0f172a;
      --text: #f3f4f6;
      --sub: #9ca3af;
      --border: #374151;
      --accent: #60a5fa;
      --shadow: 0 12px 28px rgba(0, 0, 0, 0.28);
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      font-family: Arial, "Malgun Gothic", sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    body {
      overflow: hidden;
    }

    .app {
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 16px;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px 14px;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
    }

    .title-area {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .title {
      font-size: 18px;
      font-weight: 700;
    }

    .subtitle {
      font-size: 13px;
      color: var(--sub);
    }

    .topbar-controls {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .memo-wrap {
      flex: 1;
      min-height: 0;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .memo-box {
      min-height: 0;
      display: flex;
      flex-direction: column;
      border: 1px solid var(--border);
      border-radius: 14px;
      background: var(--panel);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .memo-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    .memo-title {
      font-size: 15px;
      font-weight: 700;
    }

    .memo-tools {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .memo-editor {
      flex: 1;
      min-height: 0;
      overflow: auto;
      padding: 14px;
      outline: none;
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
      color: var(--text);
      background: var(--panel);
      caret-color: var(--text);
    }

    .memo-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--sub);
    }

    .memo-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      flex-wrap: wrap;
      padding: 8px 12px;
      border-top: 1px solid var(--border);
      color: var(--sub);
      font-size: 12px;
      background: var(--panel);
    }

    .count-badge {
      font-weight: 600;
      color: var(--text);
    }

    .save-status {
      min-width: 88px;
      font-size: 12px;
      color: var(--sub);
      text-align: right;
    }

    .save-status[data-state="saving"] {
      color: var(--accent);
    }

    .save-status[data-state="saved"] {
      color: var(--sub);
    }

    .save-status[data-state="error"] {
      color: #dc2626;
    }

    select,
    button,
    input[type="color"] {
      height: 34px;
      padding: 0 10px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--panel-2);
      color: var(--text);
      font-size: 13px;
    }

    button {
      cursor: pointer;
    }

    button:hover {
      border-color: var(--accent);
    }

    label.inline {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--sub);
      font-size: 13px;
    }

    mark {
      background: var(--highlight);
      color: inherit;
      padding: 0.05em 0.12em;
      border-radius: 3px;
    }

    @media (max-width: 980px) {
      .memo-wrap {
        grid-template-columns: 1fr;
      }

      body {
        overflow: auto;
      }

      .app {
        height: auto;
        min-height: 100vh;
      }

      .memo-box {
        min-height: 420px;
      }
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="title-area">
        <div class="title">듀얼 메모장</div>
        <div class="subtitle">다크/라이트, 글자 크기, 하이라이트, 서식 제거, 글자수 자동 집계</div>
      </div>

      <div class="topbar-controls">
        <label class="inline" for="themeSelect">테마</label>
        <select id="themeSelect">
          <option value="light">라이트</option>
          <option value="dark">다크</option>
        </select>

        <label class="inline" for="highlightColor">하이라이트</label>
        <input type="color" id="highlightColor" value="#fff59d" />

        <span class="save-status" id="saveStatus" data-state="saved">저장됨</span>
        <span class="count-badge" id="totalCount">전체 글자수: 0</span>
        <button type="button" id="clearAllBtn">전체 초기화</button>
      </div>
    </div>

    <div class="memo-wrap">
      <section class="memo-box">
        <div class="memo-head">
          <div class="memo-title">메모장 1</div>
          <div class="memo-tools">
            <label class="inline" for="fontSize1">글자 크기</label>
            <select id="fontSize1">
              <option value="12">12px</option>
              <option value="14">14px</option>
              <option value="16" selected>16px</option>
              <option value="18">18px</option>
              <option value="20">20px</option>
              <option value="24">24px</option>
              <option value="28">28px</option>
            </select>

            <button type="button" class="highlightBtn" data-target="memo1">하이라이트</button>
            <button type="button" class="removeHighlightBtn" data-target="memo1">하이라이트 해제</button>
            <button type="button" class="clearFormatBtn" data-target="memo1">선택 서식 제거</button>
            <button type="button" class="clearAllFormatBtn" data-target="memo1">전체 서식 제거</button>
          </div>
        </div>

        <div
          id="memo1"
          class="memo-editor"
          contenteditable="true"
          data-placeholder="첫 번째 메모장을 입력하세요."
        ></div>

        <div class="memo-footer">
          <span>메모장 1 독립 스크롤</span>
          <span class="count-badge" id="count1">글자수: 0</span>
        </div>
      </section>

      <section class="memo-box">
        <div class="memo-head">
          <div class="memo-title">메모장 2</div>
          <div class="memo-tools">
            <label class="inline" for="fontSize2">글자 크기</label>
            <select id="fontSize2">
              <option value="12">12px</option>
              <option value="14">14px</option>
              <option value="16" selected>16px</option>
              <option value="18">18px</option>
              <option value="20">20px</option>
              <option value="24">24px</option>
              <option value="28">28px</option>
            </select>

            <button type="button" class="highlightBtn" data-target="memo2">하이라이트</button>
            <button type="button" class="removeHighlightBtn" data-target="memo2">하이라이트 해제</button>
            <button type="button" class="clearFormatBtn" data-target="memo2">선택 서식 제거</button>
            <button type="button" class="clearAllFormatBtn" data-target="memo2">전체 서식 제거</button>
          </div>
        </div>

        <div
          id="memo2"
          class="memo-editor"
          contenteditable="true"
          data-placeholder="두 번째 메모장을 입력하세요."
        ></div>

        <div class="memo-footer">
          <span>메모장 2 독립 스크롤</span>
          <span class="count-badge" id="count2">글자수: 0</span>
        </div>
      </section>
    </div>
  </div>

  <script>
    // 파일명: dual_memo_complete.html
    // 프로젝트명: dual_memo_page_complete

    const STORAGE_KEYS = {
      theme: "dualMemo_theme",
      memo1: "dualMemo_memo1",
      memo2: "dualMemo_memo2",
      fontSize1: "dualMemo_fontSize1",
      fontSize2: "dualMemo_fontSize2",
      highlightColor: "dualMemo_highlightColor"
    };

    const themeSelect = document.getElementById("themeSelect");
    const highlightColor = document.getElementById("highlightColor");
    const clearAllBtn = document.getElementById("clearAllBtn");

    const memo1 = document.getElementById("memo1");
    const memo2 = document.getElementById("memo2");

    const fontSize1 = document.getElementById("fontSize1");
    const fontSize2 = document.getElementById("fontSize2");

    const count1 = document.getElementById("count1");
    const count2 = document.getElementById("count2");
    const totalCount = document.getElementById("totalCount");
    const saveStatus = document.getElementById("saveStatus");

    const highlightBtns = document.querySelectorAll(".highlightBtn");
    const removeHighlightBtns = document.querySelectorAll(".removeHighlightBtn");
    const clearFormatBtns = document.querySelectorAll(".clearFormatBtn");
    const clearAllFormatBtns = document.querySelectorAll(".clearAllFormatBtn");

    const SAVE_DEBOUNCE_MS = 300;
    let savedRange = null;
    let activeEditor = null;
    let saveTimer = null;
    let hasPendingSave = false;
    let hasStorageError = false;
    let pendingSaveVersion = 0;
    let lastExitFlushVersion = -1;

    function applyTheme(theme) {
      document.body.classList.toggle("dark", theme === "dark");
    }

    function applyFontSize(editor, size) {
      editor.style.fontSize = size + "px";
    }

    function applyHighlightColor(color) {
      document.documentElement.style.setProperty("--highlight", color);
    }

    function getPlainText(editor) {
      const text = typeof editor.innerText === "string" ? editor.innerText : editor.textContent || "";
      return text.replace(/\u00A0/g, " ");
    }

    function getCharCount(editor) {
      return getPlainText(editor).length;
    }

    function updateCounts() {
      const memo1Count = getCharCount(memo1);
      const memo2Count = getCharCount(memo2);

      count1.textContent = "글자수: " + memo1Count;
      count2.textContent = "글자수: " + memo2Count;
      totalCount.textContent = "전체 글자수: " + (memo1Count + memo2Count);
    }

    function setSaveStatus(message, state) {
      saveStatus.textContent = message;
      saveStatus.dataset.state = state;
    }

    function getLoadStorageErrorMessage() {
      return "불러오기 실패: 브라우저 저장소를 읽을 수 없습니다.";
    }

    function getSaveStorageErrorMessage(error) {
      if (error && (error.name === "QuotaExceededError" || error.name === "NS_ERROR_DOM_QUOTA_REACHED")) {
        return "저장 실패: 브라우저 저장 공간이 가득 찼습니다.";
      }
      return "저장 실패: 브라우저 저장소를 사용할 수 없습니다.";
    }

    function readStorage(key, fallbackValue) {
      try {
        const savedValue = localStorage.getItem(key);
        return savedValue === null ? fallbackValue : savedValue;
      } catch (error) {
        hasStorageError = true;
        setSaveStatus(getLoadStorageErrorMessage(), "error");
        return fallbackValue;
      }
    }

    function getStorageValueSafely(key) {
      try {
        return {
          ok: true,
          value: localStorage.getItem(key)
        };
      } catch (error) {
        return {
          ok: false,
          error
        };
      }
    }

    function setStorageValueSafely(key, value) {
      try {
        localStorage.setItem(key, value);
        return {
          ok: true
        };
      } catch (error) {
        return {
          ok: false,
          error
        };
      }
    }

    function removeStorageValueSafely(key) {
      try {
        localStorage.removeItem(key);
        return {
          ok: true
        };
      } catch (error) {
        return {
          ok: false,
          error
        };
      }
    }

    function persistData() {
      try {
        localStorage.setItem(STORAGE_KEYS.memo1, memo1.innerHTML);
        localStorage.setItem(STORAGE_KEYS.memo2, memo2.innerHTML);
        localStorage.setItem(STORAGE_KEYS.fontSize1, fontSize1.value);
        localStorage.setItem(STORAGE_KEYS.fontSize2, fontSize2.value);
        localStorage.setItem(STORAGE_KEYS.theme, themeSelect.value);
        localStorage.setItem(STORAGE_KEYS.highlightColor, highlightColor.value);
        hasStorageError = false;
        hasPendingSave = false;
        lastExitFlushVersion = -1;
        setSaveStatus("저장됨", "saved");
        return true;
      } catch (error) {
        hasStorageError = true;
        hasPendingSave = true;
        setSaveStatus(getSaveStorageErrorMessage(error), "error");
        return false;
      }
    }

    function scheduleSave() {
      hasPendingSave = true;
      pendingSaveVersion += 1;
      lastExitFlushVersion = -1;
      if (!hasStorageError) {
        setSaveStatus("저장 중…", "saving");
      }

      if (saveTimer) {
        window.clearTimeout(saveTimer);
      }

      saveTimer = window.setTimeout(() => {
        saveTimer = null;
        persistData();
      }, SAVE_DEBOUNCE_MS);
    }

    function flushPendingSave() {
      if (saveTimer) {
        window.clearTimeout(saveTimer);
        saveTimer = null;
      }

      if (hasPendingSave) {
        persistData();
      }
    }

    function cancelPendingSave() {
      if (saveTimer) {
        window.clearTimeout(saveTimer);
        saveTimer = null;
      }

      hasPendingSave = false;
    }

    function handlePageExit() {
      if (!hasPendingSave || lastExitFlushVersion === pendingSaveVersion) {
        return;
      }

      lastExitFlushVersion = pendingSaveVersion;
      flushPendingSave();
    }

    function snapshotStorage() {
      return Object.values(STORAGE_KEYS).reduce((snapshot, key) => {
        const result = getStorageValueSafely(key);
        if (!result.ok) {
          throw result.error;
        }
        snapshot[key] = result.value;
        return snapshot;
      }, {});
    }

    function restoreStorageSnapshot(snapshot) {
      Object.values(STORAGE_KEYS).forEach((key) => {
        const result = snapshot[key] === null
          ? removeStorageValueSafely(key)
          : setStorageValueSafely(key, snapshot[key]);

        if (!result.ok) {
          throw result.error;
        }

        if (snapshot[key] === null) {
          return;
        }
      });
    }

    function loadData() {
      hasStorageError = false;

      const savedTheme = readStorage(STORAGE_KEYS.theme, "light");
      const savedMemo1 = readStorage(STORAGE_KEYS.memo1, "");
      const savedMemo2 = readStorage(STORAGE_KEYS.memo2, "");
      const savedFontSize1 = readStorage(STORAGE_KEYS.fontSize1, "16");
      const savedFontSize2 = readStorage(STORAGE_KEYS.fontSize2, "16");
      const savedHighlightColor = readStorage(STORAGE_KEYS.highlightColor, "#fff59d");

      themeSelect.value = savedTheme;
      highlightColor.value = savedHighlightColor;

      memo1.innerHTML = savedMemo1;
      memo2.innerHTML = savedMemo2;

      fontSize1.value = savedFontSize1;
      fontSize2.value = savedFontSize2;

      applyTheme(savedTheme);
      applyFontSize(memo1, savedFontSize1);
      applyFontSize(memo2, savedFontSize2);
      applyHighlightColor(savedHighlightColor);
      updateCounts();

      if (!hasStorageError) {
        setSaveStatus("저장됨", "saved");
      }
    }

    function isSelectionInsideEditor(editor, range) {
      if (!range) return false;
      const node = range.commonAncestorContainer.nodeType === 1
        ? range.commonAncestorContainer
        : range.commonAncestorContainer.parentNode;
      return editor.contains(node);
    }

    function saveSelection(editor) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      if (isSelectionInsideEditor(editor, range)) {
        savedRange = range.cloneRange();
        activeEditor = editor;
      }
    }

    function restoreSelection() {
      if (!savedRange) return false;
      const selection = window.getSelection();
      selection.removeAllRanges();
      selection.addRange(savedRange);
      return true;
    }

    function insertPlainTextAtCursor(text) {
      const selection = window.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      range.deleteContents();

      const textNode = document.createTextNode(text);
      range.insertNode(textNode);

      range.setStartAfter(textNode);
      range.collapse(true);

      selection.removeAllRanges();
      selection.addRange(range);
    }

    function highlightSelection(editorId) {
      const editor = document.getElementById(editorId);

      if (activeEditor === editor && savedRange) {
        restoreSelection();
      } else {
        editor.focus();
      }

      const selection = window.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      if (range.collapsed || !isSelectionInsideEditor(editor, range)) return;

      const mark = document.createElement("mark");

      try {
        range.surroundContents(mark);
      } catch (error) {
        const extracted = range.extractContents();
        mark.appendChild(extracted);
        range.insertNode(mark);
      }

      selection.removeAllRanges();
      updateCounts();
      scheduleSave();
    }

    function unwrapMark(markEl) {
      const parent = markEl.parentNode;
      while (markEl.firstChild) {
        parent.insertBefore(markEl.firstChild, markEl);
      }
      parent.removeChild(markEl);
      parent.normalize();
    }

    function removeHighlight(editorId) {
      const editor = document.getElementById(editorId);

      if (activeEditor === editor && savedRange) {
        restoreSelection();
      } else {
        editor.focus();
      }

      const selection = window.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      if (!isSelectionInsideEditor(editor, range)) return;

      const marks = editor.querySelectorAll("mark");
      marks.forEach((mark) => {
        const markRange = document.createRange();
        markRange.selectNodeContents(mark);

        const overlaps =
          range.compareBoundaryPoints(Range.END_TO_START, markRange) < 0 &&
          range.compareBoundaryPoints(Range.START_TO_END, markRange) > 0;

        if (overlaps) {
          unwrapMark(mark);
        }
      });

      updateCounts();
      scheduleSave();
    }

    function clearSelectedFormatting(editorId) {
      const editor = document.getElementById(editorId);

      if (activeEditor === editor && savedRange) {
        restoreSelection();
      } else {
        editor.focus();
      }

      const selection = window.getSelection();
      if (!selection.rangeCount) return;

      const range = selection.getRangeAt(0);
      if (!isSelectionInsideEditor(editor, range) || range.collapsed) return;

      const plainText = range.toString();
      range.deleteContents();

      const textNode = document.createTextNode(plainText);
      range.insertNode(textNode);

      const newRange = document.createRange();
      newRange.selectNodeContents(textNode);
      selection.removeAllRanges();
      selection.addRange(newRange);

      editor.normalize();
      saveSelection(editor);
      updateCounts();
      scheduleSave();
    }

    function clearAllFormatting(editorId) {
      const editor = document.getElementById(editorId);
      const plainText = getPlainText(editor);
      editor.textContent = plainText;
      updateCounts();
      scheduleSave();
    }

    function resetToDefaults() {
      memo1.innerHTML = "";
      memo2.innerHTML = "";
      fontSize1.value = "16";
      fontSize2.value = "16";
      themeSelect.value = "light";
      highlightColor.value = "#fff59d";
      savedRange = null;
      activeEditor = null;

      applyTheme("light");
      applyFontSize(memo1, "16");
      applyFontSize(memo2, "16");
      applyHighlightColor("#fff59d");
      updateCounts();
    }

    function clearAllData() {
      if (!window.confirm("저장된 메모와 설정을 모두 삭제할까요?")) {
        return;
      }

      cancelPendingSave();
      let storageSnapshot = null;

      try {
        storageSnapshot = snapshotStorage();
        localStorage.removeItem(STORAGE_KEYS.memo1);
        localStorage.removeItem(STORAGE_KEYS.memo2);
        localStorage.removeItem(STORAGE_KEYS.fontSize1);
        localStorage.removeItem(STORAGE_KEYS.fontSize2);
        localStorage.removeItem(STORAGE_KEYS.theme);
        localStorage.removeItem(STORAGE_KEYS.highlightColor);
        hasStorageError = false;
        resetToDefaults();
        setSaveStatus("전체 초기화됨", "saved");
      } catch (error) {
        if (storageSnapshot) {
          try {
            restoreStorageSnapshot(storageSnapshot);
          } catch (restoreError) {}
        }
        loadData();
        hasStorageError = true;
        setSaveStatus(getSaveStorageErrorMessage(error), "error");
      }
    }

    [memo1, memo2].forEach((editor) => {
      editor.addEventListener("focus", () => {
        activeEditor = editor;
      });

      editor.addEventListener("mouseup", () => saveSelection(editor));
      editor.addEventListener("keyup", () => saveSelection(editor));

      editor.addEventListener("input", () => {
        saveSelection(editor);
        updateCounts();
        scheduleSave();
      });

      editor.addEventListener("blur", flushPendingSave);

      editor.addEventListener("paste", (e) => {
        e.preventDefault();
        const text = (e.clipboardData || window.clipboardData).getData("text/plain");
        insertPlainTextAtCursor(text);
        saveSelection(editor);
        updateCounts();
        scheduleSave();
      });
    });

    themeSelect.addEventListener("change", () => {
      applyTheme(themeSelect.value);
      scheduleSave();
    });

    highlightColor.addEventListener("input", () => {
      applyHighlightColor(highlightColor.value);
      scheduleSave();
    });

    fontSize1.addEventListener("change", () => {
      applyFontSize(memo1, fontSize1.value);
      scheduleSave();
    });

    fontSize2.addEventListener("change", () => {
      applyFontSize(memo2, fontSize2.value);
      scheduleSave();
    });

    highlightBtns.forEach((btn) => {
      btn.addEventListener("mousedown", (e) => e.preventDefault());
      btn.addEventListener("click", () => {
        highlightSelection(btn.dataset.target);
      });
    });

    removeHighlightBtns.forEach((btn) => {
      btn.addEventListener("mousedown", (e) => e.preventDefault());
      btn.addEventListener("click", () => {
        removeHighlight(btn.dataset.target);
      });
    });

    clearFormatBtns.forEach((btn) => {
      btn.addEventListener("mousedown", (e) => e.preventDefault());
      btn.addEventListener("click", () => {
        clearSelectedFormatting(btn.dataset.target);
      });
    });

    clearAllFormatBtns.forEach((btn) => {
      btn.addEventListener("click", () => {
        clearAllFormatting(btn.dataset.target);
      });
    });

    clearAllBtn.addEventListener("click", clearAllData);
    window.addEventListener("pagehide", handlePageExit);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "hidden") {
        handlePageExit();
      }
    });

    loadData();
  </script>
</body>
</html>
